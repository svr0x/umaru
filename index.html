<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umaru</title>
<meta name="description" content="All in one Discord bot">

<!-- Link preview: small thumbnail on the side -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Umaru">
<meta property="og:title" content="Umaru">

<style>
  :root { --bg:#0a0a0a; --card:#141414; --gold:#d4af37; --text:#f2f2f2; --muted:#9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid #2a2a2a;
    border-radius: 18px; padding: 32px 24px; text-align: center; }
  .pfp { width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
  h1 { margin: 16px 0 4px; font-size: 28px; letter-spacing: .5px; }
  .tag { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  .stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
  .stats b { display: block; color: var(--gold); font-size: 20px; }
  .stats span { color: var(--muted); font-size: 12px; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  a.btn { display: block; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600;
    border: 1px solid var(--gold); color: var(--gold); }
  a.btn.primary { background: var(--gold); color: #0a0a0a; }
  a.btn:hover { opacity: .85; }
</style>
</head>
<body>
  <main class="card">
    <img class="pfp" src="https://file.garden/ai5wJPrOLRCONDDM/umaru.jpg" alt="Umaru">
    <h1>Umaru</h1>
    <p class="tag">Multipurpose Discord Bot</p>
    <div class="stats">
      <div><b>245+</b><span>Servers</span></div>
      <div><b>65K+</b><span>Users</span></div>
      <div><b>131</b><span>Commands</span></div>
    </div>
    <div class="btns">
      <a class="btn primary" href="https://top.gg/bot/1490160677468241981">Invite Bot</a>
      <a class="btn" href="https://discord.gg/KEC8Ddav4g">Support Server</a>
      <a class="btn" href="https://umaru.site.je">Website</a>
    </div>
  </main>
</body>
</html>
